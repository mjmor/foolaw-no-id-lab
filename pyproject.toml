[project]
name = "no-id-lab"
version = "0.1.0"
description = "Investigation tooling and analysis for Team No ID"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pytest>=8.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
